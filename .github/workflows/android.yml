name: Android verification (manual)

on:
  workflow_dispatch:
    inputs:
      emulator:
        description: "Also run API 36 emulator tests"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'z2846852/dual-sub-replay' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, Android lint, debug APK
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Show failing tests
        if: failure()
        run: python3 tools/report_failed_tests.py app/build/test-results/ --title "Failed unit tests"

  emulator:
    if: inputs.emulator && github.repository == 'z2846852/dual-sub-replay' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "emulator" "system-images;android-36;default;x86_64"
      - uses: gradle/actions/setup-gradle@v4
      - name: Offline emulator UI tests
        run: >-
          bash ./gradlew pixel2Api36DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --no-parallel --max-workers=2 --stacktrace
