name: Fork signed Android release
on:
  workflow_run:
    workflows: ["Android build and releases"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: fork-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'z2846852/dual-sub-replay' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Only release commits with successful Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?branch=main&status=success&per_page=30" \
            --jq '.workflow_runs[].head_sha' | grep -Fxq "$sha" || {
              echo "No successful Android CI for exact main SHA" >&2
              exit 1
            }
      - name: Check dedicated signing secrets
        id: signing
        env:
          KEY: ${{ secrets.FORK_RELEASE_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.FORK_RELEASE_STORE_PASSWORD }}
          ALIAS: ${{ secrets.FORK_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FORK_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEY" || -z "$PASSWORD" || -z "$ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::notice::Configure four FORK_RELEASE_* repository secrets to enable permanent updates."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.ready == 'true'
      - name: Install SDK
        if: steps.signing.outputs.ready == 'true'
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.ready == 'true'
      - name: Assemble permanently signed fork APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.FORK_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.FORK_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.FORK_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.FORK_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export ANDROID_RELEASE_STORE_FILE="$RUNNER_TEMP/fork-keystore.jks"
          printf '%s' "$KEY" | base64 --decode > "$ANDROID_RELEASE_STORE_FILE"
          chmod 600 "$ANDROID_RELEASE_STORE_FILE"
          version="2.0.$GITHUB_RUN_NUMBER"
          code=$((100000 + GITHUB_RUN_NUMBER))
          bash ./gradlew :app:assembleRelease -PforkRelease=true \
            "-PforkVersionName=$version" "-PforkVersionCode=$code" \
            -PrequireReleaseSigning=true --stacktrace
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/DualSub-Replay.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs release/DualSub-Replay.apk \
            | tee release/signing-report.txt
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging release/DualSub-Replay.apk | head -1)"
          [[ "$badging" == *"name='com.z2846852.dualsubreplay'"* ]]
          [[ "$badging" == *"versionCode='$code'"* ]]
          printf '%s\n' "$version" > release/version.txt
          printf '%s\n' "$code" > release/code.txt
      - name: Keep one Android update signing identity
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(grep -i 'Signer #1 certificate SHA-256 digest:' release/signing-report.txt | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')"
          [[ "$current" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p old-signer
          if gh release download --pattern signing-fingerprint.txt --dir old-signer >/dev/null 2>&1; then
            old="$(tr -d '\r\n' < old-signer/signing-fingerprint.txt | tr 'A-F' 'a-f')"
            [[ "$current" == "$old" ]] || { echo "Signing identity changed" >&2; exit 1; }
          fi
          printf '%s\n' "$current" > release/signing-fingerprint.txt
      - name: Create patches from up to ten old signed releases
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p old-releases release/patches
          gh release list --limit 10 --json tagName --jq '.[].tagName' 2>/dev/null | while read -r tag; do
            [[ "$tag" =~ ^v2\.0\.[0-9]+$ ]] || continue
            mkdir -p "old-releases/$tag"
            gh release download "$tag" --dir "old-releases/$tag" --pattern DualSub-Replay.apk \
              --pattern update-info.json >/dev/null 2>&1 || true
          done
          python3 tools/apk_patch.py release --apk release/DualSub-Replay.apk \
            --old-releases old-releases --output-dir release/patches --entries release/patches.json
          python3 - <<'PY'
          import hashlib, json, pathlib
          apk=pathlib.Path("release/DualSub-Replay.apk")
          version=pathlib.Path("release/version.txt").read_text().strip()
          code=int(pathlib.Path("release/code.txt").read_text().strip())
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          patches=json.loads(pathlib.Path("release/patches.json").read_text())
          info=dict(schema=1,version=version,version_code=code,minimum_safe_version_code=0,
                    apk="DualSub-Replay.apk",sha256=digest,size=apk.stat().st_size,patches=patches)
          pathlib.Path("release/update-info.json").write_text(json.dumps(info,indent=2)+"\n")
          pathlib.Path("release/DualSub-Replay.apk.sha256").write_text(digest+"  DualSub-Replay.apk\n")
          PY
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: DualSubReplay-Fork-Stable-APK
          path: release/DualSub-Replay.apk
          retention-days: 30
      - name: Publish signed APK and patches to GitHub Release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="$(cat release/version.txt)"
          gh release create "v$version" \
            release/DualSub-Replay.apk \
            release/DualSub-Replay.apk.sha256 \
            release/update-info.json \
            release/signing-fingerprint.txt \
            release/patches/*.patch \
            --target "$GITHUB_SHA" --latest \
            --title "离线英语听力 v$version" \
            --notes "已通过 Android CI 的固定签名版。应用内更新优先使用适用的跨版本差分补丁，失败则下载完整 APK。"
