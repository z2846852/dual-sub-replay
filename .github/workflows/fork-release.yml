name: Fork signed Android release
on:
  workflow_run:
    workflows: ["Android build and releases"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  sign-and-publish:
    if: >-
      github.repository == 'z2846852/dual-sub-replay' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exactly the successful source revision
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Reject outdated CI runs before signing
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || {
            echo "A newer main commit exists; its own CI run will be used instead."
            exit 1
          }

      - name: Check private signing prerequisites
        id: signing
        env:
          DATA_PAT: ${{ secrets.DATA_READ_PAT }}
          SIGN_PASSWORD: ${{ secrets.FORK_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$DATA_PAT" || -z "$SIGN_PASSWORD" ]]; then
            echo "::notice::Signing inactive: configure DATA_READ_PAT and FORK_SIGNING_PASSWORD Secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Retrieve exact unsigned APK produced by CI (no Gradle)
        if: steps.signing.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: DualSub-Replay-fork-unsigned
          path: unsigned
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: android-actions/setup-android@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install APK signing tools
        if: steps.signing.outputs.ready == 'true'
        run: sdkmanager "build-tools;36.0.0"

      - name: Read password-protected keystore from private data repo and sign
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_READ_PAT }}
          SIGN_PASSWORD: ${{ secrets.FORK_SIGNING_PASSWORD }}
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          test -s unsigned/app-release-unsigned.apk
          # The token is scoped to private z2846852/data, Contents: Read only.
          private="$(gh api repos/z2846852/data --jq '.private')"
          [[ "$private" == "true" ]] || { echo "data repo MUST be private" >&2; exit 1; }
          keystore="$RUNNER_TEMP/dualsub-fork.p12"
          aligned="$RUNNER_TEMP/aligned.apk"
          cleanup() { rm -f "$keystore" "$aligned"; }
          trap cleanup EXIT
          gh api 'repos/z2846852/data/contents/signing/dualsub-release.p12?ref=main' \
            --jq .content | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          mkdir -p release
          buildtools="$ANDROID_HOME/build-tools/36.0.0"
          "$buildtools/zipalign" -f -p 4 unsigned/app-release-unsigned.apk "$aligned"
          "$buildtools/apksigner" sign \
            --ks "$keystore" --ks-type PKCS12 --ks-key-alias dualsubfork \
            --ks-pass env:SIGN_PASSWORD --key-pass env:SIGN_PASSWORD \
            --out release/DualSub-Replay.apk "$aligned"
          "$buildtools/apksigner" verify --verbose --print-certs release/DualSub-Replay.apk \
            | tee release/signing-report.txt
          badge="$("$buildtools/aapt" dump badging release/DualSub-Replay.apk | head -1)"
          echo "$badge"
          code=$((100000 + CI_RUN_NUMBER))
          [[ "$badge" == *"name='com.z2846852.dualsubreplay'"* ]]
          [[ "$badge" == *"versionCode='$code'"* ]]
          printf '2.0.%s\n' "$CI_RUN_NUMBER" > release/version.txt
          printf '%s\n' "$code" > release/code.txt

      - name: Verify that the signer has not changed since the previous release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest="$(grep -i 'Signer #1 certificate SHA-256 digest:' release/signing-report.txt | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p old-signer
          if gh release download --pattern signing-fingerprint.txt --dir old-signer >/dev/null 2>&1; then
            old="$(tr -d '\r\n' < old-signer/signing-fingerprint.txt | tr 'A-F' 'a-f')"
            [[ "$digest" == "$old" ]] || { echo "Signing key changed; refusing incompatible update" >&2; exit 1; }
          fi
          printf '%s\n' "$digest" > release/signing-fingerprint.txt

      - name: Build optional patches from ten recent signed releases
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p old-releases release/patches
          gh release list --limit 10 --json tagName --jq '.[].tagName' 2>/dev/null | while read -r tag; do
            [[ "$tag" =~ ^v2\.0\.[0-9]+$ ]] || continue
            mkdir -p "old-releases/$tag"
            gh release download "$tag" --dir "old-releases/$tag" --pattern DualSub-Replay.apk \
              --pattern update-info.json >/dev/null 2>&1 || true
          done
          python3 tools/apk_patch.py release --apk release/DualSub-Replay.apk \
            --old-releases old-releases --output-dir release/patches --entries release/patches.json
          python3 - <<'PY'
          import hashlib, json, pathlib
          apk = pathlib.Path("release/DualSub-Replay.apk")
          version = pathlib.Path("release/version.txt").read_text().strip()
          code = int(pathlib.Path("release/code.txt").read_text().strip())
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          patches = json.loads(pathlib.Path("release/patches.json").read_text())
          info = dict(schema=1, version=version, version_code=code, minimum_safe_version_code=0,
                      apk="DualSub-Replay.apk", sha256=digest, size=apk.stat().st_size, patches=patches)
          pathlib.Path("release/update-info.json").write_text(json.dumps(info, indent=2) + "\n")
          pathlib.Path("release/DualSub-Replay.apk.sha256").write_text(digest + "  DualSub-Replay.apk\n")
          PY

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: DualSubReplay-Fork-Stable-APK
          path: release/DualSub-Replay.apk
          retention-days: 30

      - name: Publish fixed-signature APK and cross-version patch assets
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="$(cat release/version.txt)"
          gh release create "v$version" \
            release/DualSub-Replay.apk \
            release/DualSub-Replay.apk.sha256 \
            release/update-info.json \
            release/signing-fingerprint.txt \
            release/patches/*.patch \
            --target "$CI_SHA" --latest \
            --title "离线英语听力 v$version" \
            --notes "单次编译、私有 data 仓库签名。应用内优先使用适配的跨版本差分补丁，失败则下载完整 APK。"
